<html>
<head>
  <title>Списки</title>
</head>
<body>
  <h2><em>Списки</em></h2>
  <p>
    В HTML поддерживаются следующие типы списков:
  </p>
  <ul>
    <li> маркированный список, задается парным тегом <code><mark>ul</mark></code>;</li>
    <li> нумерованный список,задается парным тегом <code><mark>ol</mark></code>.</li>
  </ul>
  <p>
     Каждый элемент списка заключается в парный тег <code><mark>li</mark></code>.
  </p>
</body>
</html>
